<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <!-- Background + subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0d1117"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>
  <rect x="0" y="0" width="1200" height="4" fill="#58a6ff"/>

  <!-- Shield icon -->
  <g transform="translate(100, 180)">
    <path d="M64 8 L112 28 L112 60 C112 90 90 112 64 120 C38 112 16 90 16 60 L16 28 Z"
          fill="#1f6feb" stroke="#58a6ff" stroke-width="3"/>
    <path d="M44 62 L58 76 L84 50" fill="none" stroke="#fff" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="240" y="240" fill="#e6edf3" font-size="56" font-weight="700">Aegis Playground</text>
  <text x="240" y="290" fill="#8b949e" font-size="24">AI Agent Governance in Your Browser</text>

  <!-- Feature pills -->
  <g transform="translate(240, 330)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="rgba(63,185,80,0.15)" stroke="#3fb950" stroke-width="1"/>
    <text x="70" y="24" fill="#3fb950" font-size="14" text-anchor="middle" font-weight="600">Auto-approve</text>

    <rect x="160" y="0" width="160" height="36" rx="18" fill="rgba(210,153,34,0.15)" stroke="#d29922" stroke-width="1"/>
    <text x="240" y="24" fill="#d29922" font-size="14" text-anchor="middle" font-weight="600">Human Review</text>

    <rect x="340" y="0" width="100" height="36" rx="18" fill="rgba(248,81,73,0.15)" stroke="#f85149" stroke-width="1"/>
    <text x="390" y="24" fill="#f85149" font-size="14" text-anchor="middle" font-weight="600">Block</text>
  </g>

  <!-- Stats -->
  <g transform="translate(240, 410)">
    <text x="0" y="0" fill="#58a6ff" font-size="32" font-weight="700">518</text>
    <text x="0" y="22" fill="#6e7681" font-size="13">tests</text>

    <text x="120" y="0" fill="#58a6ff" font-size="32" font-weight="700">&lt;1ms</text>
    <text x="120" y="22" fill="#6e7681" font-size="13">eval time</text>

    <text x="260" y="0" fill="#58a6ff" font-size="32" font-weight="700">14</text>
    <text x="260" y="22" fill="#6e7681" font-size="13">presets</text>

    <text x="360" y="0" fill="#58a6ff" font-size="32" font-weight="700">7</text>
    <text x="360" y="22" fill="#6e7681" font-size="13">adapters</text>
  </g>

  <!-- URL + version -->
  <text x="240" y="520" fill="#6e7681" font-size="16">pip install agent-aegis</text>
  <text x="240" y="548" fill="#484f58" font-size="14">github.com/Acacian/aegis</text>
  <rect x="1070" y="580" width="80" height="26" rx="13" fill="rgba(88,166,255,0.12)" stroke="#58a6ff" stroke-width="1"/>
  <text x="1110" y="598" fill="#58a6ff" font-size="12" text-anchor="middle" font-weight="600">v0.6.1</text>

  <!-- Code snippet preview -->
  <g transform="translate(700, 140)">
    <rect x="0" y="0" width="440" height="340" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="36" rx="12" fill="#1c2128"/>
    <rect x="0" y="24" width="440" height="12" fill="#1c2128"/>
    <circle cx="20" cy="18" r="6" fill="#f85149"/>
    <circle cx="38" cy="18" r="6" fill="#d29922"/>
    <circle cx="56" cy="18" r="6" fill="#3fb950"/>
    <text x="200" y="22" fill="#6e7681" font-size="11" text-anchor="middle">policy.yaml</text>

    <text x="20" y="64" fill="#6e7681" font-size="13" font-family="monospace">version:</text>
    <text x="100" y="64" fill="#a5d6ff" font-size="13" font-family="monospace">"1"</text>

    <text x="20" y="88" fill="#6e7681" font-size="13" font-family="monospace">rules:</text>
    <text x="30" y="112" fill="#6e7681" font-size="13" font-family="monospace">- name:</text>
    <text x="110" y="112" fill="#a5d6ff" font-size="13" font-family="monospace">read_auto</text>
    <text x="40" y="136" fill="#6e7681" font-size="13" font-family="monospace">risk_level:</text>
    <text x="150" y="136" fill="#3fb950" font-size="13" font-family="monospace">low</text>
    <text x="40" y="160" fill="#6e7681" font-size="13" font-family="monospace">approval:</text>
    <text x="140" y="160" fill="#3fb950" font-size="13" font-family="monospace">auto</text>

    <text x="30" y="196" fill="#6e7681" font-size="13" font-family="monospace">- name:</text>
    <text x="110" y="196" fill="#a5d6ff" font-size="13" font-family="monospace">write_approve</text>
    <text x="40" y="220" fill="#6e7681" font-size="13" font-family="monospace">risk_level:</text>
    <text x="150" y="220" fill="#d29922" font-size="13" font-family="monospace">medium</text>
    <text x="40" y="244" fill="#6e7681" font-size="13" font-family="monospace">approval:</text>
    <text x="140" y="244" fill="#d29922" font-size="13" font-family="monospace">approve</text>

    <text x="30" y="280" fill="#6e7681" font-size="13" font-family="monospace">- name:</text>
    <text x="110" y="280" fill="#a5d6ff" font-size="13" font-family="monospace">delete_block</text>
    <text x="40" y="304" fill="#6e7681" font-size="13" font-family="monospace">approval:</text>
    <text x="140" y="304" fill="#f85149" font-size="13" font-family="monospace">block</text>
  </g>
</svg>
