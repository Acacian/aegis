site_name: Aegis
site_url: https://acacian.github.io/aegis/
site_description: The simplest way to govern AI agent actions. No infra. No lock-in. Just Python.
repo_url: https://github.com/Acacian/aegis
repo_name: Acacian/aegis
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - social

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Acacian/aegis
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agent-aegis/

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Concepts: getting-started/concepts.md
  - Guides:
      - Writing Policies: guides/policies.md
      - Integrations: guides/integrations.md
      - MCP Governance: guides/mcp-governance.md
      - Custom Adapters: guides/custom-adapters.md
      - Approval Handlers: guides/approval-handlers.md
      - REST API Server: guides/rest-api.md
      - Security Model: guides/security-model.md
      - Testing: guides/testing.md
  - API Reference:
      - Runtime: api/runtime.md
      - Policy: api/policy.md
      - Action & Result: api/models.md
      - Adapters: api/adapters.md
      - Audit: api/audit.md
  - Cookbook:
      - LangChain Governance: cookbook/langchain-governance.md
  - Cheatsheet: cheatsheet.md
  - Examples: https://github.com/Acacian/aegis/tree/main/examples
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
