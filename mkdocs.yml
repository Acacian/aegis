site_name: Agent-Aegis
site_url: https://acacian.github.io/aegis/
site_description: Python library for AI agent governance. Auto-instruments LangChain, CrewAI, OpenAI, Anthropic, LiteLLM, Google ADK, DSPy + 5 more with prompt injection blocking, PII masking, policy CI/CD, audit trail.
site_author: Dongha Koo (@Acacian)
repo_url: https://github.com/Acacian/aegis
repo_name: Acacian/aegis
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Dongha Koo — MIT License

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en
  - social:
      cards: false  # Disabled: requires Pillow/CairoSVG. OG images injected via overrides/main.html instead.

extra:
  generator: false  # Remove "Made with Material for MkDocs" from footer
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Acacian/aegis
      name: Agent-Aegis on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agent-aegis/
      name: Agent-Aegis on PyPI
  alternate:
    - name: English
      link: /aegis/
      lang: en
    - name: 한국어
      link: https://github.com/Acacian/aegis/blob/main/README.ko.md
      lang: ko
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: Helpful
          data: 1
        - icon: material/emoticon-sad-outline
          name: Needs work
          data: 0

markdown_extensions:
  - meta  # Enables page-level metadata (title, description, keywords) for SEO
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page

