      - Integrations: guides/integrations.md
      - Dashboard: guides/dashboard.md
      - MCP Governance: guides/mcp-governance.md
      - Aegis vs Alternatives: guides/alternatives.md
      - Custom Adapters: guides/custom-adapters.md
      - Approval Handlers: guides/approval-handlers.md
      - REST API Server: guides/rest-api.md
      - Security Model: guides/security-model.md
      - Deployment: guides/deployment.md
      - Policy Patterns: guides/policy-patterns.md
      - Governance Checklist: guides/governance-checklist.md
      - Testing: guides/testing.md
  - API Reference:
      - Runtime: api/runtime.md
      - Policy: api/policy.md
      - Action & Result: api/models.md
      - Adapters: api/adapters.md
      - Audit: api/audit.md
      - Anomaly Detection: api/anomaly.md
      - Compliance: api/compliance.md
      - Dashboard API: api/dashboard.md
  - Solutions:
